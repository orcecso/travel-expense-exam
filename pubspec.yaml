name: travel_expense_app
description: A small Flutter app for reporting travel expenses (Clean Architecture + Riverpod).
publish_to: 'none'
version: 1.0.0+1
 
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.19.0"
 
dependencies:
  flutter:
    sdk: flutter
 
  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
 
  # Functional error handling
  dartz: ^0.10.1
 
  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
 
  # Networking
  dio: ^5.11.1
 
  # DI
  get_it: ^9.2.1
 
  # Navigation
  go_router: ^18.0.1
 
  # Utils
  equatable: ^2.1.0
  intl: ^0.20.3
 
  cupertino_icons: ^1.0.9
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
 
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.8.0
 
  mocktail: ^1.0.5
 
flutter:
  uses-material-design: true
